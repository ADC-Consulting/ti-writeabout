  function adminReveal() {
    app.appendChild(h('h1', {}, 'The ', h('span', { class: 'accent' }, 'reveal.'), ' 🌈'));
    const toggle = h('button', {
      class: 'btn-primary',
      onclick: e => {
        const p = evPos(e);
        revealStep = revealStep === 1 ? 2 : 1;
        render();
        confetti(60);
        burst(p.x, p.y, { count: 18 });
      }
    }, revealStep === 1 ? 'Show people 🧚' : '← Back to topics');
    app.appendChild(h('div', { class: 'row mb-md', style: 'margin-top: 1rem;' }, toggle));

    if (revealStep === 1) {
      const cov = state.coverage || [];

      // Highlights: what the votes, nominations and picks say when put together
      const byDesc = f => [...cov].sort((a, b) => f(b) - f(a))[0];
      const fav = cov.length ? byDesc(c => c.stars) : null;
      const asked = cov.length ? byDesc(c => c.requested) : null;
      const gap = cov.filter(c => c.writers === 0).sort((a, b) => (b.stars + b.requested) - (a.stars + a.requested))[0];
      const hls = [];
      if (fav && fav.stars > 0) hls.push({ emoji: '👑', label: 'Crowd favourite', text: fav.text, meta: '⭐ ' + votes(fav.stars) + ' · ' + fav.writers + (fav.writers === 1 ? ' writer' : ' writers'), color: SOFT[2] });
      if (asked && asked.requested > 0) hls.push({ emoji: '💌', label: 'Most requested', text: asked.text, meta: asked.requested + ' colleagues asked for it · ⭐ ' + asked.stars, color: SOFT[0] });
      if (gap) hls.push({ emoji: '🦄', label: 'Biggest gap', text: gap.text, meta: '⭐ ' + gap.stars + ' · asked ' + gap.requested + '× · no writer yet', color: SOFT[1] });
      if (hls.length) {
        const wrap = h('div', { class: 'highlights' });
        hls.forEach((x, i) => wrap.appendChild(enter(h('div', { class: 'hl', style: '--hc:' + x.color },
          h('span', { class: 'hl-emoji' }, x.emoji), h('div', { class: 'hl-label' }, x.label),
          h('div', { class: 'hl-text' }, x.text), h('div', { class: 'hl-meta' }, x.meta)), i)));
        app.appendChild(wrap);
      }

      app.appendChild(h('div', { class: 'feed-header' }, 'Topic coverage'));
      const maxS = Math.max(1, ...cov.map(c => c.stars));
      const maxW = Math.max(1, ...cov.map(c => Math.max(c.requested, c.writers)));
      cov.forEach((c, i) => {
        const row = enter(h('div', { class: 'rank-row' }), i + hls.length);
        row.appendChild(h('div', { class: 'lb-rank', style: 'min-width: 44px; font-size: 28px;' },
          c.stars > 0 && i === 0 ? '👑' : c.stars > 0 && i < 3 ? MEDALS[i] : String(i + 1)));
        const body = h('div', { class: 'rank-body' });
        body.appendChild(h('div', { class: 'rank-name' }, c.text));
        const bars = h('div', { class: 'cov-bars' });
        const bar = (label, cls, val, max) => {
          bars.appendChild(h('span', {}, label));
          const tr = h('div', { class: 'cov-track' });
          tr.appendChild(h('div', { class: 'cov-fill ' + cls, style: 'width:' + (100 * val / max) + '%' }));
          bars.appendChild(tr);
        };
        bar('⭐ ' + votes(c.stars), 'star', c.stars, maxS);
        bar('💌 asked ' + c.requested + '×', 'req', c.requested, maxW);
        bar('✍️ ' + c.writers + (c.writers === 1 ? ' writer' : ' writers'), 'wri', c.writers, maxW);
        body.appendChild(bars);
        row.appendChild(body);
        row.appendChild(c.writers > 0 ? h('span', { class: 'covered-badge' }, '✓ covered')
          : c.requested > 0 ? h('span', { class: 'open-badge' }, '🔥 wanted · no writer')
          : h('span', { class: 'open-badge' }, '🦄 open'));
        app.appendChild(row);
      });
    } else {
      // Ranked by hearts: ideas first (most loved on top), then people without an idea, then people not in the session
      const all = state.cards || [];
      const kind = c => c.present === false ? 2 : (c.idea ? 0 : 1);
      const ranked = all.map((c, i) => ({ c, i }))
        .sort((a, b) => kind(a.c) - kind(b.c) || (b.c.loves || 0) - (a.c.loves || 0) || a.i - b.i)
        .map(x => x.c);
      const totalLoves = all.reduce((n, c) => n + (c.loves || 0), 0);

      // Podium of the most loved ideas
      const podium = ranked.filter(c => c.idea && c.loves > 0).slice(0, 3);
      if (podium.length) {
        const labels = ['Most loved idea', 'Runner-up', 'Third place'];
        const wrap = h('div', { class: 'highlights' });
        podium.forEach((c, i) => wrap.appendChild(enter(h('div', { class: 'hl', style: '--hc:' + SOFT[[2, 0, 4][i]] },
          h('span', { class: 'hl-emoji' }, ['👑', '🥈', '🥉'][i]), h('div', { class: 'hl-label' }, labels[i]),
          h('div', { class: 'hl-text' }, '“' + c.idea + '”'),
          h('div', { class: 'hl-meta' }, c.name + ' · 💖 ' + c.loves)), i)));
        app.appendChild(wrap);
      }

      app.appendChild(h('div', { class: 'feed-header' }, 'People · 💖 ' + totalLoves + ' hearts so far, colleagues are voting on their phones'));
      const grid = h('div', { class: 'cards-grid' });
      ranked.forEach((c, i) => {
        const el = enter(personCard(c, { love: 'admin' }), i);
        el.setAttribute('data-flip', c.id);
        grid.appendChild(el);
      });
      app.appendChild(grid);

      // New hearts since the last render: bump the card and let hearts fly
      const prevLoves = lovePrev;
      afterRender.push(() => {
        all.forEach(c => {
          const before = prevLoves && prevLoves[c.id];
          if (before === undefined || (c.loves || 0) <= before) return;
          const el = app.querySelector('.person-card[data-flip="' + c.id + '"]');
          if (!el) return;
          el.classList.add('bump');
          burstEl(el.querySelector('.love-chip') || el, { count: 10 + 4 * Math.min(4, c.loves - before), label: '+' + (c.loves - before) + ' 💖', emojis: ['💖', '💗', '💕', '✨', '🦄'], spread: 170 });
        });
        lovePrev = Object.fromEntries(all.map(c => [c.id, c.loves || 0]));
      });
    }

    const actions = h('div', { class: 'row', style: 'margin-top: 2rem;' });
    actions.appendChild(h('a', { class: 'btn-secondary', href: '/api/export' }, 'Export ↓'));
    actions.appendChild(h('button', {
      class: 'btn-ghost',
      onclick: () => {
        if (confirm('Reset wipes everything. Did you export first?')) {
          revealStep = 1;
          act('POST', '/api/reset');
        }
      }
    }, 'Reset (export first!)'));
    app.appendChild(actions);
  }

  // ============ RENDER ============
  function render() {
    if (!state) return;

    // Remember focus + cursor so a re-render doesn't interrupt typing
    const ae = document.activeElement;
    let focusK = null, selStart = null, selEnd = null;
    if (ae && ae.dataset && ae.dataset.k && app.contains(ae)) {
      focusK = ae.dataset.k;
      try { selStart = ae.selectionStart; selEnd = ae.selectionEnd; } catch (e) { /* select has none */ }
    }

    // FLIP: remember where reorderable rows are so they can glide to their new spot
    const flipBefore = {};
    app.querySelectorAll('[data-flip]').forEach(el => { const r = el.getBoundingClientRect(); flipBefore[el.dataset.flip] = { top: r.top, left: r.left }; });

    const phase = state.phase;
    const viewKey = (IS_ADMIN ? 'a' : 'p') + phase + (IS_ADMIN ? revealStep : '') + (state.me ? 'm' : 'n');
    const fresh = viewKey !== lastViewKey;
    if (fresh) { lbPrev = null; demandPrev = null; lovePrev = null; }
    if (phase === 'join') fired.clear();
    afterRender = [];

    app.innerHTML = '';
    app.classList.toggle('fresh', fresh);
    app.appendChild(brandMark());
    if (IS_ADMIN) app.appendChild(steps());

    if (IS_ADMIN) {
      if (phase === 'join') adminJoin();
      else if (phase === 'topics') adminTopics();
      else if (phase === 'who') adminWho();
      else if (phase === 'what') adminWhat();
      else adminReveal();
    } else if (!state.me) {
      phoneJoin();
    } else if (phase === 'join') phoneJoinPhase();
    else if (phase === 'topics') phoneTopics();
    else if (phase === 'who') phoneWho();
    else if (phase === 'what') phoneWhat();
    else phoneReveal();

    if (focusK) {
      const el = app.querySelector('[data-k="' + focusK + '"]');
      if (el) {
        el.focus();
        if (selStart != null) { try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* ignore */ } }
      }
    }
    startTick();

    // FLIP: animate rows that moved
    if (!REDUCED && !fresh) {
      app.querySelectorAll('[data-flip]').forEach(el => {
        const before = flipBefore[el.dataset.flip];
        if (!before) return;
        const r = el.getBoundingClientRect();
        const dy = before.top - r.top, dx = before.left - r.left;
        if (Math.abs(dy) < 2 && Math.abs(dx) < 2) return;
        el.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }], { duration: 700, easing: 'cubic-bezier(.3,1.35,.5,1)' });
      });
    }

    afterRender.forEach(fn => { try { fn(); } catch (e) { /* effects must never break the app */ } });

    if (phase === 'reveal' && lastPhase !== 'reveal') setTimeout(() => confetti(140), 250);

    seen.topics = new Set(state.topics.map(t => t.id));
    seen.players = new Set(state.players.map(p => p.id));
    lastViewKey = viewKey;
    lastPhase = phase;
  }

  // Init: build the sky, fetch state from server, then start polling
  buildSky();
  api('GET', '/api/state')
    .then(s => { setState(s); startPoll(); })
    .catch(() => app.innerHTML = '<p style="color:#E0385C;padding:2rem;font-weight:800">Could not connect to server.</p>');
})();
</script>
