<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADC Post-a-thon</title>
<style>
  :root {
    --adc-green: #C4FF3D;
    --adc-green-dim: #A8E62D;
    --adc-green-soft: #E8FFB0;
    --adc-dark: #0A0A0A;
    --adc-dark-2: #1A1A1A;
    --adc-off-white: #F5F5F0;
    --adc-text-muted: #8A8A80;
    --adc-border: #2A2A28;
    --adc-danger: #FF6B6B;
    --adc-warning: #FFB84D;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
    background: var(--adc-dark);
    color: var(--adc-off-white);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  /* Brand mark */
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 2rem;
  }
  .brand-dot {
    width: 10px;
    height: 10px;
    background: var(--adc-green);
    border-radius: 50%;
  }
  .brand-text {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--adc-off-white);
  }

  h1 {
    font-size: 44px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin-bottom: 0.75rem;
  }
  h1 .accent { color: var(--adc-green); }
  h2 {
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 15px;
    color: var(--adc-text-muted);
    margin-bottom: 2rem;
  }

  .card {
    background: var(--adc-dark-2);
    border: 1px solid var(--adc-border);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }
  .card-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--adc-text-muted);
    margin-bottom: 0.75rem;
  }

  input[type="text"], select, textarea {
    width: 100%;
    background: var(--adc-dark);
    border: 1px solid var(--adc-border);
    color: var(--adc-off-white);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    transition: border 0.15s;
  }
  input[type="text"]:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--adc-green);
  }
  textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
  select { cursor: pointer; }

  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    transition: transform 0.1s, background 0.15s, opacity 0.15s;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-primary {
    background: var(--adc-green);
    color: var(--adc-dark);
  }
  .btn-primary:hover:not(:disabled) { background: var(--adc-green-dim); }

  .btn-secondary {
    background: transparent;
    color: var(--adc-off-white);
    border: 1px solid var(--adc-border);
  }
  .btn-secondary:hover { border-color: var(--adc-off-white); }

  .btn-ghost {
    background: transparent;
    color: var(--adc-text-muted);
    padding: 6px 12px;
    font-size: 12px;
    border: 1px solid var(--adc-border);
    border-radius: 8px;
  }
  .btn-ghost:hover { color: var(--adc-off-white); border-color: var(--adc-off-white); }

  .row { display: flex; gap: 8px; align-items: center; }

  /* Participant pills */
  .pill-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--adc-dark);
    border: 1px solid var(--adc-border);
    padding: 6px 6px 6px 14px;
    border-radius: 100px;
    font-size: 13px;
    color: var(--adc-off-white);
  }
  .pill .remove {
    background: transparent;
    border: none;
    color: var(--adc-text-muted);
    cursor: pointer;
    padding: 2px 6px;
    font-size: 14px;
    line-height: 1;
  }
  .pill .remove:hover { color: var(--adc-danger); }

  /* Big timer */
  .timer-block {
    background: var(--adc-dark-2);
    border: 1px solid var(--adc-border);
    border-radius: 20px;
    padding: 2rem 1.5rem;
    margin-bottom: 1.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .timer-block.warn { border-color: var(--adc-warning); }
  .timer-block.danger { border-color: var(--adc-danger); }
  .timer-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--adc-text-muted);
    margin-bottom: 0.5rem;
  }
  .timer-big {
    font-size: 96px;
    font-weight: 500;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.04em;
    color: var(--adc-green);
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
  }
  .timer-big.warn { color: var(--adc-warning); }
  .timer-big.danger { color: var(--adc-danger); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

  .timer-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--adc-border);
  }
  .timer-meta-count {
    font-size: 13px;
    color: var(--adc-off-white);
  }
  .timer-bar-track {
    height: 3px;
    background: var(--adc-border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 1rem;
  }
  .timer-bar-fill {
    height: 100%;
    background: var(--adc-green);
    transition: width 0.5s linear;
  }
  .timer-block.warn .timer-bar-fill { background: var(--adc-warning); }
  .timer-block.danger .timer-bar-fill { background: var(--adc-danger); }

  /* Posts */
  .post {
    background: var(--adc-dark-2);
    border: 1px solid var(--adc-border);
    border-radius: 14px;
    padding: 1.25rem;
    margin-bottom: 0.75rem;
    transition: border 0.15s;
    animation: slide-in 0.3s ease-out;
  }
  @keyframes slide-in {
    from { transform: translateY(-8px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .post-anon {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--adc-green);
    margin-bottom: 0.5rem;
  }
  .post-content {
    font-size: 15px;
    line-height: 1.6;
    color: var(--adc-off-white);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .post-vote-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 1rem;
  }
  .star-count {
    font-size: 13px;
    color: var(--adc-green);
    font-weight: 500;
  }

  .star-btn {
    background: transparent;
    border: 1px solid var(--adc-border);
    color: var(--adc-off-white);
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 100px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .star-btn:hover { border-color: var(--adc-green); color: var(--adc-green); }
  .star-btn.starred {
    background: var(--adc-green);
    color: var(--adc-dark);
    border-color: var(--adc-green);
  }
  .star-btn.starred:hover { background: var(--adc-green-dim); }

  /* Voter banner */
  .voter-banner {
    background: var(--adc-dark-2);
    border: 1px solid var(--adc-border);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 1.25rem;
  }
  .voter-banner.active {
    border-color: var(--adc-green);
    background: rgba(196, 255, 61, 0.06);
  }
  .voter-banner label {
    font-size: 13px;
    font-weight: 500;
    color: var(--adc-text-muted);
    white-space: nowrap;
  }
  .voter-banner.active label { color: var(--adc-green); }
  .voter-banner select { flex: 1; }

  /* Progress */
  .progress-block {
    margin: 1.5rem 0 1rem;
  }
  .progress-label {
    font-size: 12px;
    color: var(--adc-text-muted);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .progress-track {
    height: 4px;
    background: var(--adc-border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--adc-green);
    transition: width 0.3s;
  }

  /* Winner */
  .winner-card {
    background: linear-gradient(135deg, rgba(196, 255, 61, 0.12), rgba(196, 255, 61, 0.03));
    border: 1px solid var(--adc-green);
    border-radius: 20px;
    padding: 2rem;
    margin-bottom: 1.5rem;
    text-align: center;
    animation: winner-in 0.5s ease-out;
  }
  @keyframes winner-in {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .winner-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--adc-green);
    margin-bottom: 0.5rem;
  }
  .winner-name {
    font-size: 32px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    color: var(--adc-off-white);
  }
  .winner-content {
    background: rgba(0, 0, 0, 0.3);
    padding: 1rem 1.25rem;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--adc-off-white);
    white-space: pre-wrap;
    text-align: left;
    margin-bottom: 1rem;
  }
  .winner-votes {
    font-size: 13px;
    color: var(--adc-green);
    font-weight: 500;
  }

  .rank-row {
    display: flex;
    gap: 16px;
    padding: 14px 16px;
    background: var(--adc-dark-2);
    border: 1px solid var(--adc-border);
    border-radius: 12px;
    margin-bottom: 6px;
    align-items: flex-start;
  }
  .rank-medal {
    font-size: 14px;
    font-weight: 500;
    color: var(--adc-text-muted);
    min-width: 32px;
    padding-top: 2px;
  }
  .rank-body { flex: 1; min-width: 0; }
  .rank-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--adc-off-white);
    margin-bottom: 2px;
  }
  .rank-content {
    font-size: 13px;
    color: var(--adc-text-muted);
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .rank-votes {
    font-size: 12px;
    color: var(--adc-green);
    font-weight: 500;
    white-space: nowrap;
  }

  .helper-text {
    font-size: 12px;
    color: var(--adc-text-muted);
    text-align: center;
    margin-top: 1rem;
  }

  .empty-state {
    font-size: 14px;
    color: var(--adc-text-muted);
    font-style: italic;
    text-align: center;
    padding: 2rem 1rem;
  }

  .feed-header {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--adc-text-muted);
    margin: 2rem 0 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .feed-header::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--adc-green);
    border-radius: 50%;
  }

  .w-full { width: 100%; }
  .mb-sm { margin-bottom: 0.5rem; }
  .mb-md { margin-bottom: 1rem; }
  .mt-md { margin-top: 1rem; }
</style>
</head>
<body>

<div class="page" id="app"></div>

<script>
(function() {
  const IS_ADMIN = window.location.pathname === '/admin';
  const TOTAL_SECONDS = 15 * 60;

  let state = { phase: 'setup', endsAt: null, participants: [], posts: [], votes: {}, awards: {} };
  let currentVoterId = null;
  let tickTimer = null;
  let pollTimer = null;
  const app = document.getElementById('app');

  // ---- API helpers ----
  async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(path, opts);
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || res.statusText);
    }
    return res.json();
  }

  function applyState(newState) {
    state = newState;
    render();
  }

  async function poll() {
    try {
      const newState = await api('GET', '/api/state');
      if (JSON.stringify(newState) === JSON.stringify(state)) return;

      // In writing phase: preserve the draft form so typing isn't interrupted
      if (state.phase === 'writing' && newState.phase === 'writing') {
        const sel = app.querySelector('select');
        const ta = app.querySelector('textarea');
        const savedAuthor = sel ? sel.value : null;
        const savedContent = ta ? ta.value : '';
        state = newState;
        render();
        const sel2 = app.querySelector('select');
        const ta2 = app.querySelector('textarea');
        if (sel2 && savedAuthor) sel2.value = savedAuthor;
        if (ta2) ta2.value = savedContent;
      } else {
        applyState(newState);
      }
    } catch (e) {
      // Silently ignore transient poll failures
    }
  }

  function startPoll() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(poll, 2000);
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }
  function remaining() {
    if (!state.endsAt) return TOTAL_SECONDS;
    return Math.max(0, Math.round((state.endsAt - Date.now()) / 1000));
  }

  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        if (k === 'style') el.setAttribute('style', attrs[k]);
        else if (k.startsWith('on') && typeof attrs[k] === 'function') el.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
        else if (k === 'class') el.className = attrs[k];
        else el.setAttribute(k, attrs[k]);
      }
    }
    for (const c of children) {
      if (c == null || c === false) continue;
      if (typeof c === 'string' || typeof c === 'number') el.appendChild(document.createTextNode(c));
      else el.appendChild(c);
    }
    return el;
  }

  function brandMark() {
    const mark = h('div', { class: 'brand' });
    mark.appendChild(h('div', { class: 'brand-dot' }));
    mark.appendChild(h('span', { class: 'brand-text' }, 'ADC° Post-a-thon'));
    return mark;
  }

  function startTick() {
    if (tickTimer) clearInterval(tickTimer);
    tickTimer = setInterval(() => {
      if (state.phase !== 'writing') return;
      const big = document.getElementById('timer-big');
      const block = document.getElementById('timer-block');
      const bar = document.getElementById('timer-bar');
      const r = remaining();
      if (big) big.textContent = fmtTime(r);
      if (block) {
        block.classList.remove('warn', 'danger');
        if (big) big.classList.remove('warn', 'danger');
        if (r < 60) { block.classList.add('danger'); if (big) big.classList.add('danger'); }
        else if (r < 300) { block.classList.add('warn'); if (big) big.classList.add('warn'); }
      }
      if (bar) bar.style.width = (100 * r / TOTAL_SECONDS) + '%';
    }, 500);
  }

  // ============ SETUP ============
  function renderSetup() {
    app.innerHTML = '';
    app.appendChild(brandMark());

    const heading = h('h1', {}, 'Post-a-thon,');
    const br = document.createElement('br');
    heading.appendChild(br);
    heading.appendChild(h('span', { class: 'accent' }, '15 minutes.'));
    app.appendChild(heading);
    app.appendChild(h('p', { class: 'subtitle' }, 'Everyone writes. Posts stay anonymous. Best one wins.'));

    const card = h('div', { class: 'card' });
    card.appendChild(h('div', { class: 'card-label' }, 'Players (' + state.participants.length + ')'));

    if (state.participants.length === 0) {
      card.appendChild(h('div', { class: 'empty-state', style: 'padding: 1rem 0; text-align: left;' },
        IS_ADMIN ? 'Add everyone\'s names to get started.' : 'Waiting for the host to add players...'
      ));
    } else {
      const grid = h('div', { class: 'pill-grid' });
      state.participants.forEach(p => {
        const pill = h('span', { class: 'pill' }, p.name);
        if (IS_ADMIN) {
          pill.appendChild(h('button', {
            class: 'remove',
            onclick: () => api('DELETE', '/api/participants/' + p.id).then(applyState).catch(console.error)
          }, '×'));
        }
        grid.appendChild(pill);
      });
      card.appendChild(grid);
    }

    const row = h('div', { class: 'row' });
    const input = h('input', { type: 'text', placeholder: 'Add your name & hit enter...' });
    const addName = () => {
      const v = input.value.trim();
      if (v) {
        input.value = '';
        api('POST', '/api/participants', { name: v })
          .then(applyState)
          .catch(console.error);
        setTimeout(() => { const inp = app.querySelector('input[type="text"]'); if (inp) inp.focus(); }, 50);
      }
    };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') addName(); });
    row.appendChild(input);
    row.appendChild(h('button', { class: 'btn-secondary', onclick: addName }, 'Add'));
    card.appendChild(row);
    app.appendChild(card);

    if (IS_ADMIN) {
      const actions = h('div', { class: 'row mt-md' });
      const canStart = state.participants.length >= 2;
      const startBtn = h('button', {
        class: 'btn-primary w-full',
        style: 'flex: 1; padding: 16px;',
        onclick: () => api('POST', '/api/start').then(applyState).catch(console.error)
      }, 'Start 15-minute post-a-thon →');
      if (!canStart) startBtn.disabled = true;
      actions.appendChild(startBtn);

      if (state.posts.length > 0 || state.endsAt) {
        actions.appendChild(h('button', {
          class: 'btn-ghost',
          onclick: () => {
            if (confirm('Reset everything?')) {
              currentVoterId = null;
              api('POST', '/api/reset').then(applyState).catch(console.error);
            }
          }
        }, 'Reset'));
      }
      app.appendChild(actions);
    } else {
      app.appendChild(h('p', { class: 'helper-text', style: 'margin-top: 1rem;' }, 'Waiting for the host to start the post-a-thon...'));
    }

    app.appendChild(h('p', { class: 'helper-text' }, 'Posts remain anonymous until the final reveal.'));
  }

  // ============ WRITING ============
  function renderWriting() {
    app.innerHTML = '';
    app.appendChild(brandMark());

    const r = remaining();
    const pct = 100 * r / TOTAL_SECONDS;
    const phaseClass = r < 60 ? 'danger' : r < 300 ? 'warn' : '';

    const timer = h('div', { class: 'timer-block ' + phaseClass, id: 'timer-block' });
    timer.appendChild(h('div', { class: 'timer-label' }, 'Time remaining'));
    timer.appendChild(h('div', { class: 'timer-big ' + phaseClass, id: 'timer-big' }, fmtTime(r)));

    const meta = h('div', { class: 'timer-meta' });
    meta.appendChild(h('span', { class: 'timer-meta-count' },
      state.posts.length + ' post' + (state.posts.length === 1 ? '' : 's') + ' submitted'
    ));
    if (IS_ADMIN) {
      meta.appendChild(h('button', {
        class: 'btn-ghost',
        onclick: () => {
          if (confirm('End writing phase and start voting?')) {
            api('POST', '/api/end-writing').then(applyState).catch(console.error);
          }
        }
      }, 'End early →'));
    }
    timer.appendChild(meta);

    const bar = h('div', { class: 'timer-bar-track' });
    bar.appendChild(h('div', { class: 'timer-bar-fill', id: 'timer-bar', style: 'width: ' + pct + '%;' }));
    timer.appendChild(bar);
    app.appendChild(timer);

    // Post form
    const card = h('div', { class: 'card' });
    card.appendChild(h('div', { class: 'card-label' }, 'Drop a post'));

    const authorSelect = h('select', { style: 'margin-bottom: 10px;' });
    authorSelect.appendChild(h('option', { value: '' }, 'Who are you? (hidden from others)'));
    state.participants.forEach(p => authorSelect.appendChild(h('option', { value: p.id }, p.name)));
    card.appendChild(authorSelect);

    const textarea = h('textarea', { placeholder: 'Write your post...' });
    card.appendChild(textarea);

    card.appendChild(h('button', {
      class: 'btn-primary mt-md',
      onclick: () => {
        const authorId = authorSelect.value;
        const content = textarea.value.trim();
        if (!authorId) { alert('Pick your name first (it stays hidden).'); return; }
        if (!content) { alert('Write something!'); return; }
        textarea.value = '';
        api('POST', '/api/posts', { authorId, content }).then(applyState).catch(console.error);
      }
    }, 'Post anonymously →'));
    app.appendChild(card);

    // Feed
    app.appendChild(h('div', { class: 'feed-header' }, 'Anonymous feed · ' + state.posts.length));

    if (state.posts.length === 0) {
      app.appendChild(h('div', { class: 'empty-state' }, 'Nothing yet. Be the first to post.'));
    } else {
      const sorted = [...state.posts].sort((a, b) => b.createdAt - a.createdAt);
      sorted.forEach((post, idx) => {
        const pc = h('div', { class: 'post' });
        pc.appendChild(h('div', { class: 'post-anon' }, 'Anonymous #' + (state.posts.length - idx)));
        pc.appendChild(h('div', { class: 'post-content' }, post.content));
        app.appendChild(pc);
      });
    }
  }

  // ============ VOTING ============
  function renderVoting() {
    app.innerHTML = '';
    app.appendChild(brandMark());

    app.appendChild(h('h1', {}, 'Star your ', h('span', { class: 'accent' }, 'favourites.')));
    app.appendChild(h('p', { class: 'subtitle' }, 'Star as many as you want. Tap again to unstar.'));

    // Voter picker
    const voterBanner = h('div', { class: 'voter-banner' + (currentVoterId ? ' active' : '') });
    voterBanner.appendChild(h('label', {}, currentVoterId ? '✓ Voting as' : 'I am'));
    const voterSelect = h('select', {});
    voterSelect.appendChild(h('option', { value: '' }, 'Pick your name'));
    state.participants.forEach(p => {
      const opt = h('option', { value: p.id }, p.name);
      if (p.id === currentVoterId) opt.selected = true;
      voterSelect.appendChild(opt);
    });
    voterSelect.addEventListener('change', () => {
      currentVoterId = voterSelect.value || null;
      render();
    });
    voterBanner.appendChild(voterSelect);
    app.appendChild(voterBanner);

    if (!currentVoterId) {
      app.appendChild(h('p', { class: 'helper-text', style: 'margin-bottom: 1rem;' }, 'Pick your name above, then star the posts you love.'));
    }

    if (state.posts.length === 0) {
      app.appendChild(h('div', { class: 'empty-state' }, 'No posts were submitted.'));
    } else {
      state.posts.forEach((post, idx) => {
        const voters = state.votes[post.id] || [];
        const hasMyVote = currentVoterId && voters.includes(currentVoterId);
        const voteCount = voters.length;

        const pc = h('div', { class: 'post' });
        pc.appendChild(h('div', { class: 'post-anon' }, 'Anonymous #' + (idx + 1)));
        pc.appendChild(h('div', { class: 'post-content' }, post.content));

        const voteRow = h('div', { class: 'post-vote-row' });
        voteRow.appendChild(h('span', { class: 'star-count' },
          voteCount > 0 ? voteCount + ' star' + (voteCount === 1 ? '' : 's') : ''
        ));
        voteRow.appendChild(h('button', {
          class: 'star-btn' + (hasMyVote ? ' starred' : ''),
          onclick: () => {
            if (!currentVoterId) { alert('Pick your name at the top first.'); return; }
            api('POST', '/api/votes', { postId: post.id, voterId: currentVoterId })
              .then(applyState).catch(console.error);
          }
        }, hasMyVote ? '★ Starred' : '☆ Star'));
        pc.appendChild(voteRow);

        app.appendChild(pc);
      });
    }

    // Progress
    const totalVoters = state.participants.length;
    const votedCount = new Set(Object.values(state.votes).flat()).size;
    const prog = h('div', { class: 'progress-block' });
    const progLabel = h('div', { class: 'progress-label' });
    progLabel.appendChild(h('span', {}, votedCount + ' of ' + totalVoters + ' voted'));
    progLabel.appendChild(h('span', {}, Math.round(totalVoters ? 100 * votedCount / totalVoters : 0) + '%'));
    prog.appendChild(progLabel);
    const track = h('div', { class: 'progress-track' });
    track.appendChild(h('div', { class: 'progress-fill', style: 'width: ' + (totalVoters ? 100 * votedCount / totalVoters : 0) + '%;' }));
    prog.appendChild(track);
    app.appendChild(prog);

    if (IS_ADMIN) {
      app.appendChild(h('button', {
        class: 'btn-primary w-full',
        style: 'padding: 16px; margin-top: 1rem;',
        onclick: () => api('POST', '/api/reveal').then(applyState).catch(console.error)
      }, 'Reveal the winner →'));
    }
  }

  // ============ RESULTS ============
  function renderResults() {
    app.innerHTML = '';
    app.appendChild(brandMark());

    app.appendChild(h('h1', {}, 'And the winner', document.createElement('br'), h('span', { class: 'accent' }, 'is...')));
    app.appendChild(h('p', { class: 'subtitle' }, 'The votes are in.'));

    const best = state.awards.best;
    if (best && best.votes > 0) {
      const winner = h('div', { class: 'winner-card' });
      winner.appendChild(h('div', { class: 'winner-label' }, '🏆  Best post'));
      winner.appendChild(h('div', { class: 'winner-name' }, best.post.authorName));
      winner.appendChild(h('div', { class: 'winner-content' }, best.post.content));
      winner.appendChild(h('div', { class: 'winner-votes' },
        '★ ' + best.votes + ' star' + (best.votes === 1 ? '' : 's')
      ));
      app.appendChild(winner);
    } else {
      app.appendChild(h('div', { class: 'empty-state' }, 'No stars were given!'));
    }

    if (state.awards.ranking && state.awards.ranking.length > 1) {
      app.appendChild(h('div', { class: 'feed-header' }, 'Full ranking'));
      state.awards.ranking.slice(1).forEach((r, i) => {
        const medal = i === 0 ? '2nd' : i === 1 ? '3rd' : '#' + (i + 2);
        const row = h('div', { class: 'rank-row' });
        row.appendChild(h('div', { class: 'rank-medal' }, medal));
        const body = h('div', { class: 'rank-body' });
        body.appendChild(h('div', { class: 'rank-name' }, r.post.authorName));
        body.appendChild(h('div', { class: 'rank-content' }, r.post.content));
        body.appendChild(h('div', { class: 'rank-votes', style: 'margin-top: 6px;' },
          '★ ' + r.votes + ' star' + (r.votes === 1 ? '' : 's')
        ));
        row.appendChild(body);
        app.appendChild(row);
      });
    }

    if (IS_ADMIN) {
      app.appendChild(h('button', {
        class: 'btn-primary w-full',
        style: 'margin-top: 1.5rem; padding: 16px;',
        onclick: () => {
          currentVoterId = null;
          api('POST', '/api/reset').then(applyState).catch(console.error);
        }
      }, 'New post-a-thon →'));
    }
  }

  function render() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    if (state.phase === 'setup') renderSetup();
    else if (state.phase === 'writing') { renderWriting(); startTick(); }
    else if (state.phase === 'voting') renderVoting();
    else if (state.phase === 'results') renderResults();
  }

  // Init: fetch state from server, then start polling
  api('GET', '/api/state')
    .then(s => { state = s; render(); startPoll(); })
    .catch(() => app.innerHTML = '<p style="color:#ff6b6b;padding:2rem">Could not connect to server.</p>');
})();
</script>

</body>
</html>
